[www]
user = www-data
group = www-data

listen = 9000

; Expose only the configuration variables required by WordPress.
env[DOMAIN_NAME] = $DOMAIN_NAME
env[MYSQL_DATABASE] = $MYSQL_DATABASE
env[MYSQL_USER] = $MYSQL_USER

pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s
pm.max_requests = 300

catch_workers_output = yes