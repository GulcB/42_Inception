name: inception

services:
  mariadb:
    image: mariadb:inception
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    pull_policy: build
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
    secrets:
      - db_password
      - db_root_password
    networks:
      - internal
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$(cat /run/secrets/db_root_password)\" mariadb --protocol=socket -u root -N -s -e 'SELECT 1' 2>/dev/null | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
  wordpress:
    image: wordpress:inception
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    pull_policy: build
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:?DOMAIN_NAME is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      WP_SITE_TITLE: ${WP_SITE_TITLE:?WP_SITE_TITLE is required}
      WP_ADMIN_USER: ${WP_ADMIN_USER:?WP_ADMIN_USER is required}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:?WP_ADMIN_EMAIL is required}
      WP_USER: ${WP_USER:?WP_USER is required}
      WP_USER_EMAIL: ${WP_USER_EMAIL:?WP_USER_EMAIL is required}
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    networks:
      - internal
    volumes:
      - wordpress_data:/var/www/html
    tmpfs:
      - /run/wordpress

networks:
  internal:
    driver: bridge

volumes:
  mariadb_data:
    driver: local

  wordpress_data:
    driver: local

secrets:
  db_password:
    file: ../secrets/db_password.txt

  db_root_password:
    file: ../secrets/db_root_password.txt

    wp_admin_password:
    file: ../secrets/wp_admin_password.txt

  wp_user_password:
    file: ../secrets/wp_user_password.txt